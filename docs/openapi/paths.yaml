/users:
  get:
    tags:
      - users
    summary: Get list of all users in the system.
    description: Get list of all users
    operationId: getUsers
    parameters:
      - in: query
        description: Field to sort the results by.
        name: sortField
        required: false
        schema:
          type: string
          enum: [name, email, orcid, systemRoles, programs, active, createdAt, updatedAt, createdByUserId, updatedByUserId]
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/sortOrder'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/usersResponse'
            examples:
              arrayOfUsers:
                $ref: '#/components/examples/arrayOfUsers'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              type: string
            example: |-
              ERROR - 2018-10-08T20:15:11Z - Malformed JSON Request Object
              ERROR - 2018-10-08T20:15:11Z - Invalid query parameter
              ERROR - 2018-10-08T20:15:11Z - Required parameter is missing
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              type: string
            example: ERROR - 2018-10-08T20:15:11Z - Missing or expired authorization
              token
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              type: string
            example: ERROR - 2018-10-08T20:15:11Z - User does not have permission
              to perform this action
  post:
    tags:
      - users
    summary: Create user
    description: Create a new user.
    operationId: createUser
    requestBody:
      description: User information to create
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/newUserRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/usersResponse_1'
            example:
              metadata:
                datafiles: []
                pagination:
                  currentPage: 1
                  pageSize: 1
                  totalCount: 1
                  totalPages: 1
                status: []
              result:
                id: d4f23375-0033-4d16-a62f-072e3a9198fa
                orcid: null
                name: Bob Smith
                email: bob@bob.com
                active: true
                systemRoles: [
                  {
                    id: "d4f23375-0033-4d16-a62f-072e3a9198fa",
                    domain: "admin"
                  }
                ]
                programRoles: []
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              type: string
            example: |-
              ERROR - 2018-10-08T20:15:11Z - Malformed JSON Request Object
              ERROR - 2018-10-08T20:15:11Z - Invalid query parameter
              ERROR - 2018-10-08T20:15:11Z - Required parameter is missing
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              type: string
            example: ERROR - 2018-10-08T20:15:11Z - Missing or expired authorization
              token
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              type: string
            example: ERROR - 2018-10-08T20:15:11Z - User does not have permission
              to perform this action
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              type: string
            example: ERROR - 2018-10-08T20:15:11Z - Email already exists
/users/search:
  post:
    tags:
      - users
    parameters:
      - in: query
        description: Field to sort the results by.
        name: sortField
        required: false
        schema:
          type: string
          enum: [name, email, orcid, systemRoles, programs, active, createdAt, updatedAt, createdByUserId, updatedByUserId]
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/sortOrder'
    summary: Search users
    description: Search users using filters
    operationId: searchUsers
    requestBody:
      description: Search request
      content:
        application/json:
          schema:
            type: object
            properties:
              filter:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      enum: [name, email, orcid, systemRoles, programs, active, createdAt, updatedAt, createdByUserId, updatedByUserId]
                    value:
                      type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/usersResponse'
            examples:
              arrayOfUsers:
                $ref: '#/components/examples/arrayOfUsers'
      '400':
        $ref: '#/components/responses/400BadRequest'
      '401':
        $ref: '#/components/responses/401Unauthorized'
